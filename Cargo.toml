[package]
name = "blabber-bot"
version = "0.1.0"
edition = "2021"
description = "A Discord music bot with age-restricted video support, built on serenity + songbird"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
] }
songbird = "0.6"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Codec support for songbird's symphonia-based mixer. Songbird requests no
# codecs by default; these cover AAC/ALAC/MP3 in MP4 plus symphonia's defaults
# (Matroska/WebM, Ogg, Wave, FLAC, PCM, Vorbis).
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }

[profile.release]
lto = "thin"
